<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futbol</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#008080;--foot:#eafffa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1c1c;--foot:#9cc3bb}}
:root[data-theme="dark"]{--bg:#0b1c1c;--foot:#9cc3bb}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;font:14px/1.45 Tahoma,Verdana,sans-serif}
.win{width:min(100%,580px);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px;box-shadow:3px 3px 0 #000}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:3px 8px;margin-bottom:3px}
.form{background:#000}
svg{display:block;width:100%;height:auto}
.p{font:700 190px "Courier New",monospace;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke-linejoin:round}
.y{fill:#ff0;stroke:#000;stroke-width:40}
.u{fill:#3b5bff;stroke:#fff;stroke-width:36}
.h{font-size:420px}
#ball{fill:#fff;stroke:#000;stroke-width:24;transition:transform .5s ease-out}
#dk{font:700 170px Tahoma,Verdana,sans-serif;fill:#eaffea;text-anchor:end}
.sc{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px 0;color:#0ff;font-weight:700}
.sc span{flex:1}
.sc .l{text-align:right}
.sc b{width:38px;padding:2px 0;text-align:center;color:#f22;border:1px solid #333;font:700 20px "Courier New",monospace}
#msg{min-height:72px;display:grid;place-items:center;padding:0 8px;color:#0f0;font:700 clamp(22px,6.5vw,34px)/1.1 "Arial Black",Impact,sans-serif;text-align:center;white-space:pre-line}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;padding:4px 8px 14px;color:#0f0}
.ctl[hidden]{display:none}
.ctl label{display:flex;gap:5px;align-items:center;cursor:pointer}
button{font:inherit;padding:5px 20px;color:#000;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer}
button:active{border-color:#404040 #fff #fff #404040}
.foot{width:min(100%,580px);margin:0;color:var(--foot);text-align:center;font-size:12px}
@media (prefers-reduced-motion:reduce){#ball{transition:none}}
</style>
</head>
<body>
<div class="win">
  <div class="tb">⚽ Futbol</div>
  <div class="form">
    <svg viewBox="0 240 5655 4320" role="img" aria-label="Futbol sahası">
      <rect x="0" y="240" width="5655" height="4320" fill="#008000"/>
      <g fill="none" stroke="#e8f5e8" stroke-width="22">
        <rect x="120" y="360" width="5400" height="4080"/>
        <path d="M2760 360V4440M120 1680H360V3120H120M120 1200H960V3600H120M5520 1800H5280V3000H5520M5520 1200H4680V3600H5520"/>
        <circle cx="2767" cy="2407" r="487"/>
      </g>
      <text id="dk" x="5440" y="620">0. dakika</text>
      <g id="pl"></g>
      <circle id="ball" r="75" cx="0" cy="0"/>
    </svg>
    <div class="sc"><span class="l" id="sl">Sarı Takım -</span><b id="s1">0</b><b id="s2">0</b><span id="sr">- Lacivert Takım</span></div>
    <div id="msg" aria-live="polite"></div>
    <div class="ctl" id="ctl">
      <label><input type="radio" name="d" value="2000" checked> 3 Dakika</label>
      <label><input type="radio" name="d" value="3333"> 5 Dakika</label>
      <label><input type="radio" name="d" value="10000"> 15 Dakika</label>
      <button id="go">Başla</button>
    </div>
  </div>
</div>
<p class="foot">Orijinal: Futbol 1.0.19 (Visual Basic), Kemal Ogün Işık, 12 Şubat 2002<br>“sanal adamlar maç yapıyolar. e ben maç seyretmeyi sevmem o zaman niye yapttım ki ben bunu.. ne bileyim yaaa offf.”</p>
<script>
const $=id=>document.getElementById(id);
// Oyuncu yerleri (orijinal formdan): 1-11 = a takımı, 12-22 = b takımı
const A=[[360,2280],[960,1440],[960,3120],[2520,3840],[2520,720],[2400,3120],[2400,1560],[2280,2280],[3720,3360],[3960,2280],[3600,1200]];
const B=[[5160,2280],[4560,3120],[4560,1440],[2880,720],[2880,3840],[3000,1560],[3000,3120],[3120,2280],[1920,1200],[1440,2280],[1920,3480]];
const pos=[...A,...B],NAME=['Sarı Takım','Lacivert Takım'];
// Pas tablosu (orijinaldeki Timer1..Timer22): topu tutan oyuncudan sonraki oyuncu. 0 = gol
const T=[,
[2,3,4,5,6,7,8,15,16,17,18,19,20,21,22],
[9,3,4,5,6,7,8,20,16,17,18,19,20,21,21],
[2,11,4,5,6,7,8,15,16,17,18,19,20,21,22],
[9,11,10,5,6,7,8,13,16,16,18,18,12,13,14],
[11,10,4,9,6,7,8,15,15,17,17,13,12,13,14],
[10,9,4,5,11,7,8,19,16,16,18,19,12,13,14],
[11,10,4,5,6,8,9,15,15,17,19,19,12,13,14],
[7,6,19,5,4,17,18,17,18,9,11,10,13,14,12],
[10,10,10,13,13,12,12,0],
[9,0,9,12,12,12,0,0],
[10,10,9,14,14,12,0,0],
[13,14,15,16,17,18,19,9,5,6,7,8,9,10,10],
[20,14,15,16,17,18,19,4,5,6,7,8,9,10,11],
[13,22,15,16,17,18,19,4,5,6,7,8,9,10,11],
[20,22,21,16,17,18,19,5,7,2,7,8,3,2,1],
[20,22,15,21,17,18,19,4,4,6,6,3,3,2,1],
[20,22,21,16,15,18,19,8,5,5,7,8,3,2,1],
[20,22,21,16,17,15,19,4,4,6,8,8,3,2,1],
[20,22,21,16,17,18,15,6,7,6,7,8,3,2,1],
[21,21,21,2,2,1,1,0],
[20,0,20,1,1,1,0,0],
[21,21,20,3,3,1,0,0]];
let col=[0,1],s=[0,0],holder=8,minute=0,poss=0,clk=0,st=0;
$('pl').innerHTML=pos.map((p,i)=>`<text class="p" id="p${i+1}" x="${p[0]+60}" y="${p[1]+120}">${i%11+1}</text>`).join('');
function say(t,ms){clearTimeout(st);$('msg').textContent=t;if(ms)st=setTimeout(()=>{$('msg').textContent=''},ms)}
function show(){
  for(let n=1;n<=22;n++)$('p'+n).setAttribute('class','p '+(col[n>11?1:0]?'u':'y')+(n===holder?' h':''));
  const p=pos[holder-1],len=String(holder>11?holder-11:holder).length;
  $('ball').style.transform=`translate(${p[0]+60+126*len+100}px,${p[1]+210}px)`;
  $('sl').textContent=NAME[col[0]]+' -';$('sr').textContent='- '+NAME[col[1]];
  $('s1').textContent=s[col[0]];$('s2').textContent=s[col[1]];
  $('dk').textContent=minute+'. dakika';
}
function step(){
  const t=T[holder],r=t[Math.random()*t.length|0];
  if(r)holder=r;
  else{const g=holder>11?1:0;s[col[g]]++;holder=g?8:19;say('Gooooolll !!',3500)}
  show();poss=setTimeout(step,1000);
}
function tick(){
  minute++;
  if(minute>90){
    minute=90;clearInterval(clk);clearTimeout(poss);show();
    say('Maç Bitti !\n'+(s[0]>s[1]?'Sarı Takım Kazandı ...':s[1]>s[0]?'Lacivert Takım Kazandı ...':'Maç Berabere Bitti ...'));
    $('go').textContent='Yeni Maç';$('ctl').hidden=false;return;
  }
  if(minute===45){clearTimeout(poss);col=[1,0];holder=8;say('Devre !',4000);poss=setTimeout(step,1000)}
  show();
}
$('go').onclick=()=>{
  clearInterval(clk);clearTimeout(poss);
  col=[0,1];s=[0,0];minute=0;holder=8;say('');
  $('ctl').hidden=true;show();
  poss=setTimeout(step,1000);
  clk=setInterval(tick,+document.querySelector('input[name=d]:checked').value);
};
show();
</script>
</body>
</html>
